/* DATADARK — modo limpo, sem barras externas */
html,body{margin:0!important;background:#050a0d!important;}
body{padding:24px 0!important;min-height:100vh;}
.shell{max-width:none!important;margin:0!important;padding:0!important;}
.stage{display:flex!important;justify-content:center!important;overflow:auto!important;}
.page{margin:0 auto!important;box-shadow:0 14px 44px rgba(0,0,0,.42)!important;}
.base{user-select:none!important;-webkit-user-drag:none!important;pointer-events:none!important;}
.overlay{display:block!important;pointer-events:none!important;}
.mask{opacity:0!important;pointer-events:none!important;transition:opacity .12s ease!important;}
.edit{color:transparent!important;text-shadow:none!important;background:transparent!important;pointer-events:auto!important;cursor:text!important;caret-color:#00d4ff!important;transition:color .12s ease,background .12s ease,box-shadow .12s ease!important;}
.edit.active,.edit.modified{color:#f2f5f6!important;}
.mask.active,.mask.modified{opacity:.985!important;}
.edit.active,.edit.modified{background:transparent!important;box-shadow:none!important;}
.edit.active:focus,.edit.modified:focus{box-shadow:inset 0 0 0 1px rgba(0,212,255,.78)!important;}
@media print{
  html,body{background:#000!important;padding:0!important;}
  .stage{overflow:visible!important;}
  .page{width:210mm!important;height:297mm!important;box-shadow:none!important;}
}
@media(max-width:840px){body{padding:0!important}.stage{justify-content:flex-start!important}}
</style>
<style id="datadark-no-edit">
