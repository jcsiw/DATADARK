name: Base de Conhecimento - Validação

on:
  push:
    branches:
      - main
    paths:
      - "base-conhecimento/artigos/**"
      - "base-conhecimento/data/categorias.json"
      - "base-conhecimento/data/indice.json"
      - "base-conhecimento/index.html"
      - "base-conhecimento/assets/css/**"
      - "base-conhecimento/assets/js/**"
      - "scripts/base-conhecimento/*.mjs"
      - "scripts/base-conhecimento/templates/**"
      - "scripts/base-conhecimento/testar-template-artigo.py"
      - "scripts/base-conhecimento/taxonomia.py"
      - "scripts/base-conhecimento/testar-taxonomia.py"
      - "scripts/base-conhecimento/validar-artigos.py"
      - "scripts/base-conhecimento/gerar-indice.py"
      - "scripts/base-conhecimento/testar-gerador-indice.py"
      - "scripts/base-conhecimento/criar-artigo.py"
      - "scripts/base-conhecimento/testar-criar-artigo.py"
      - "scripts/base-conhecimento/testar-criar-artigo-persistencia.py"
      - "scripts/base-conhecimento/validar-catalogo-editorial.py"
      - "scripts/base-conhecimento/testar-catalogo-editorial.py"
      - "scripts/base-conhecimento/testar-seo-artigos.py"
      - "scripts/base-conhecimento/editorial/catalogo.json"
      - ".github/workflows/base-conhecimento-validacao.yml"
      - ".github/workflows/base-conhecimento-indexacao.yml"

  pull_request:
    branches:
      - main
    paths:
      - "base-conhecimento/artigos/**"
      - "base-conhecimento/data/categorias.json"
      - "base-conhecimento/data/indice.json"
      - "base-conhecimento/index.html"
      - "base-conhecimento/assets/css/**"
      - "base-conhecimento/assets/js/**"
      - "scripts/base-conhecimento/*.mjs"
      - "scripts/base-conhecimento/templates/**"
      - "scripts/base-conhecimento/testar-template-artigo.py"
      - "scripts/base-conhecimento/taxonomia.py"
      - "scripts/base-conhecimento/testar-taxonomia.py"
      - "scripts/base-conhecimento/validar-artigos.py"
      - "scripts/base-conhecimento/gerar-indice.py"
      - "scripts/base-conhecimento/testar-gerador-indice.py"
      - "scripts/base-conhecimento/criar-artigo.py"
      - "scripts/base-conhecimento/testar-criar-artigo.py"
      - "scripts/base-conhecimento/testar-criar-artigo-persistencia.py"
      - "scripts/base-conhecimento/validar-catalogo-editorial.py"
      - "scripts/base-conhecimento/testar-catalogo-editorial.py"
      - "scripts/base-conhecimento/testar-seo-artigos.py"
      - "scripts/base-conhecimento/editorial/catalogo.json"
      - ".github/workflows/base-conhecimento-validacao.yml"
      - ".github/workflows/base-conhecimento-indexacao.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-conhecimento-validacao-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validar:

    name: Validar Base de Conhecimento

    runs-on: ubuntu-latest

    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:

      - name: Checkout do repositório
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          check-latest: false

      - name: Informações do ambiente
        run: |
          set -Eeuo pipefail

          echo "===== SISTEMA ====="
          uname -a

          echo
          echo "===== PYTHON ====="
          python3 --version

          echo
          echo "===== NODE ====="
          node --version

          echo
          echo "===== GIT ====="
          git --version

          echo
          echo "===== COMMIT ====="
          git rev-parse HEAD

          echo
          echo "===== BRANCH / REF ====="
          echo "${GITHUB_REF}"

      - name: Validar permissões dos scripts
        run: |
          set -Eeuo pipefail

          ARQUIVOS=(
            "scripts/base-conhecimento/validar-artigos.py"
            "scripts/base-conhecimento/gerar-indice.py"
            "scripts/base-conhecimento/testar-gerador-indice.py"
            "scripts/base-conhecimento/testar-taxonomia.py"
            "scripts/base-conhecimento/testar-template-artigo.py"
            "scripts/base-conhecimento/criar-artigo.py"
            "scripts/base-conhecimento/testar-criar-artigo.py"
            "scripts/base-conhecimento/testar-criar-artigo-persistencia.py"
            "scripts/base-conhecimento/validar-catalogo-editorial.py"
            "scripts/base-conhecimento/testar-catalogo-editorial.py"
            "scripts/base-conhecimento/testar-seo-artigos.py"
            "scripts/base-conhecimento/testar-categorias.mjs"
            "scripts/base-conhecimento/testar-pesquisa.mjs"
            "scripts/base-conhecimento/testar-consulta.mjs"
            "scripts/base-conhecimento/testar-interface.mjs"
          )

          for arquivo in "${ARQUIVOS[@]}"; do

            if [[ ! -f "${arquivo}" ]]; then
              echo "ERRO: arquivo ausente: ${arquivo}"
              exit 1
            fi

            modo="$(
              git ls-files --stage -- "${arquivo}" \
              | awk '{print $1}'
            )"

            if [[ "${modo}" != "100755" ]]; then
              echo "ERRO: modo Git inválido para ${arquivo}"
              echo "Modo encontrado: ${modo:-AUSENTE}"
              echo "Modo esperado: 100755"
              exit 1
            fi

            echo "OK: ${arquivo} = ${modo}"

          done

          TAXONOMIA="scripts/base-conhecimento/taxonomia.py"

          if [[ ! -f "${TAXONOMIA}" ]]; then
            echo "ERRO: arquivo ausente: ${TAXONOMIA}"
            exit 1
          fi

          modo="$(
            git ls-files --stage -- "${TAXONOMIA}" |
            awk '{print $1}'
          )"

          if [[ "${modo}" != "100644" ]]; then
            echo "ERRO: modo Git inválido para ${TAXONOMIA}"
            echo "Modo encontrado: ${modo:-AUSENTE}"
            echo "Modo esperado: 100644"
            exit 1
          fi

          echo "OK: ${TAXONOMIA} = ${modo}"

          TEMPLATE="scripts/base-conhecimento/templates/artigo-v1.html"

          if [[ ! -f "${TEMPLATE}" ]]; then
            echo "ERRO: arquivo ausente: ${TEMPLATE}"
            exit 1
          fi

          modo="$(
            git ls-files --stage -- "${TEMPLATE}" \
            | awk '{print $1}'
          )"

          if [[ "${modo}" != "100644" ]]; then
            echo "ERRO: modo Git inválido para ${TEMPLATE}"
            echo "Modo encontrado: ${modo:-AUSENTE}"
            echo "Modo esperado: 100644"
            exit 1
          fi

          echo "OK: ${TEMPLATE} = ${modo}"

          CATALOGO="scripts/base-conhecimento/editorial/catalogo.json"

          if [[ ! -f "${CATALOGO}" ]]; then
            echo "ERRO: arquivo ausente: ${CATALOGO}"
            exit 1
          fi

          modo="$(
            git ls-files --stage -- "${CATALOGO}" \
            | awk '{print $1}'
          )"

          if [[ "${modo}" != "100644" ]]; then
            echo "ERRO: modo Git inválido para ${CATALOGO}"
            echo "Modo encontrado: ${modo:-AUSENTE}"
            echo "Modo esperado: 100644"
            exit 1
          fi

          echo "OK: ${CATALOGO} = ${modo}"

          MODULOS_JS=(
            "base-conhecimento/assets/js/normalizador.js"
            "base-conhecimento/assets/js/categorias.js"
            "base-conhecimento/assets/js/pesquisa.js"
            "base-conhecimento/assets/js/consulta.js"
            "base-conhecimento/assets/js/interface.js"
          )

          for arquivo in "${MODULOS_JS[@]}"; do

            if [[ ! -f "${arquivo}" ]]; then
              echo "ERRO: arquivo ausente: ${arquivo}"
              exit 1
            fi

            modo="$(
              git ls-files --stage -- "${arquivo}"               | awk '{print $1}'
            )"

            if [[ "${modo}" != "100644" ]]; then
              echo "ERRO: modo Git inválido para ${arquivo}"
              echo "Modo encontrado: ${modo:-AUSENTE}"
              echo "Modo esperado: 100644"
              exit 1
            fi

            echo "OK: ${arquivo} = ${modo}"

          done

      - name: Validar sintaxe Python
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-pycache
        run: |
          set -Eeuo pipefail

          python3 -m py_compile \
            scripts/base-conhecimento/taxonomia.py \
            scripts/base-conhecimento/testar-taxonomia.py \
            scripts/base-conhecimento/validar-artigos.py \
            scripts/base-conhecimento/gerar-indice.py \
            scripts/base-conhecimento/testar-gerador-indice.py \
            scripts/base-conhecimento/testar-template-artigo.py \
            scripts/base-conhecimento/criar-artigo.py \
            scripts/base-conhecimento/testar-criar-artigo.py \
            scripts/base-conhecimento/testar-criar-artigo-persistencia.py \
            scripts/base-conhecimento/validar-catalogo-editorial.py \
            scripts/base-conhecimento/testar-catalogo-editorial.py \
            scripts/base-conhecimento/testar-seo-artigos.py

          echo "OK: sintaxe Python válida."

      - name: Validar sintaxe JavaScript
        run: |
          set -Eeuo pipefail

          MODULOS_JS=(
            "base-conhecimento/assets/js/normalizador.js"
            "base-conhecimento/assets/js/categorias.js"
            "base-conhecimento/assets/js/pesquisa.js"
            "base-conhecimento/assets/js/consulta.js"
            "base-conhecimento/assets/js/interface.js"
          )

          TESTES_JS=(
            "scripts/base-conhecimento/testar-categorias.mjs"
            "scripts/base-conhecimento/testar-pesquisa.mjs"
            "scripts/base-conhecimento/testar-consulta.mjs"
            "scripts/base-conhecimento/testar-interface.mjs"
          )

          for arquivo in "${MODULOS_JS[@]}"; do
            node               --experimental-default-type=module               --check               "${arquivo}"
          done

          for arquivo in "${TESTES_JS[@]}"; do
            node --check "${arquivo}"
          done

          echo "OK: sintaxe JavaScript válida."

      - name: Executar testes da taxonomia
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-taxonomia.py

      - name: Executar testes do gerador
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-gerador-indice.py

      - name: Executar testes do template oficial de artigo
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-template-artigo.py

      - name: Executar testes do Gerador Oficial de Artigos
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-criar-artigo.py

      - name: Executar testes da persistência transacional
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-criar-artigo-persistencia.py

      - name: Executar testes do Catálogo Editorial
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-catalogo-editorial.py

      - name: Executar testes da taxonomia JavaScript
        run: |
          set -Eeuo pipefail

          node             --experimental-default-type=module             scripts/base-conhecimento/testar-categorias.mjs

      - name: Executar testes do motor de pesquisa
        run: |
          set -Eeuo pipefail

          node             --experimental-default-type=module             scripts/base-conhecimento/testar-pesquisa.mjs

      - name: Executar testes da consulta integrada
        run: |
          set -Eeuo pipefail

          node             --experimental-default-type=module             scripts/base-conhecimento/testar-consulta.mjs

      - name: Executar testes da interface categorial
        run: |
          set -Eeuo pipefail

          node \
            --experimental-default-type=module \
            scripts/base-conhecimento/testar-interface.mjs

      - name: Validar artigos reais
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/validar-artigos.py

      - name: Executar testes do SEO Individual
        run: |
          set -Eeuo pipefail

          PYTHONDONTWRITEBYTECODE=1 \
          python3 \
            scripts/base-conhecimento/testar-seo-artigos.py

      - name: Validar indice.json versionado
        run: |
          set -Eeuo pipefail

          python3 -m json.tool \
            base-conhecimento/data/indice.json \
            > /dev/null

          echo "OK: indice.json versionado é JSON válido."

      - name: Validar Catálogo Editorial
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/validar-catalogo-editorial.py

      - name: Gerar índice de homologação
        run: |
          set -Eeuo pipefail

          TEMP_INDEX="${RUNNER_TEMP}/datadark-base-conhecimento-indice.json"

          rm -f "${TEMP_INDEX}"

          python3 \
            scripts/base-conhecimento/gerar-indice.py \
            --output "${TEMP_INDEX}"

          test -f "${TEMP_INDEX}"

          echo
          echo "===== ÍNDICE TEMPORÁRIO ====="

          python3 -m json.tool \
            "${TEMP_INDEX}" \
            > /dev/null

          echo "OK: JSON temporário válido."

          echo
          echo "===== SHA-256 ====="

          sha256sum \
            "${TEMP_INDEX}"

      - name: Verificar índice de homologação
        run: |
          set -Eeuo pipefail

          TEMP_INDEX="${RUNNER_TEMP}/datadark-base-conhecimento-indice.json"

          python3 \
            scripts/base-conhecimento/gerar-indice.py \
            --output "${TEMP_INDEX}" \
            --check

          echo "OK: índice temporário corresponde aos artigos."

      - name: Controle final de integridade
        run: |
          set -Eeuo pipefail

          echo "===== GIT DIFF CHECK ====="

          git diff --check

          echo
          echo "===== WORKING TREE ====="

          status="$(
            git status --porcelain
          )"

          if [[ -n "${status}" ]]; then

            echo "ERRO: o workflow modificou o repositório."
            echo
            printf '%s\n' "${status}"

            exit 1

          fi

          echo "OK: working tree permanece limpo."

      - name: Resultado final
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "BASE DE CONHECIMENTO DATADARK"
          echo "VALIDAÇÃO CONCLUÍDA COM SUCESSO"
          echo "=============================================="
