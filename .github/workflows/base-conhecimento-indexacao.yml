name: Base de Conhecimento - Indexação e Publicação

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions: {}

concurrency:
  group: base-conhecimento-indexacao-main
  cancel-in-progress: true

jobs:

  indexar:

    name: Validar, indexar e preparar site

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: write
      pages: read

    defaults:
      run:
        shell: bash

    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:

      - name: Checkout da main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          check-latest: false

      - name: Informações do ambiente
        run: |
          set -Eeuo pipefail

          echo "===== SISTEMA ====="
          uname -a

          echo
          echo "===== PYTHON ====="
          python3 --version

          echo
          echo "===== NODE ====="
          node --version

          echo
          echo "===== GIT ====="
          git --version

          echo
          echo "===== HEAD ====="
          git rev-parse HEAD

          echo
          echo "===== REF ====="
          echo "${GITHUB_REF}"

          echo
          echo "===== ACTOR ====="
          echo "${GITHUB_ACTOR}"

      - name: Validar permissões dos scripts
        run: |
          set -Eeuo pipefail

          ARQUIVOS=(
            "scripts/base-conhecimento/validar-artigos.py"
            "scripts/base-conhecimento/gerar-indice.py"
            "scripts/base-conhecimento/testar-gerador-indice.py"
            "scripts/base-conhecimento/testar-taxonomia.py"
            "scripts/base-conhecimento/testar-template-artigo.py"
            "scripts/base-conhecimento/criar-artigo.py"
            "scripts/base-conhecimento/testar-criar-artigo.py"
            "scripts/base-conhecimento/testar-criar-artigo-persistencia.py"
            "scripts/base-conhecimento/validar-catalogo-editorial.py"
            "scripts/base-conhecimento/testar-catalogo-editorial.py"
            "scripts/base-conhecimento/testar-seo-artigos.py"
            "scripts/base-conhecimento/gerar-relacionados.py"
            "scripts/base-conhecimento/testar-gerar-relacionados.py"
            "scripts/base-conhecimento/renderizar-relacionados.py"
            "scripts/base-conhecimento/testar-renderizar-relacionados.py"
            "scripts/base-conhecimento/sincronizar-artigos.py"
            "scripts/base-conhecimento/testar-sincronizar-artigos.py"
            "scripts/base-conhecimento/testar-categorias.mjs"
            "scripts/base-conhecimento/testar-pesquisa.mjs"
            "scripts/base-conhecimento/testar-consulta.mjs"
            "scripts/base-conhecimento/testar-interface.mjs"
          )

          for arquivo in "${ARQUIVOS[@]}"; do

            if [[ ! -f "${arquivo}" ]]; then
              echo "ERRO: arquivo ausente: ${arquivo}"
              exit 1
            fi

            modo="$(
              git ls-files --stage -- "${arquivo}" \
              | awk '{print $1}'
            )"

            if [[ "${modo}" != "100755" ]]; then
              echo "ERRO: modo Git inválido para ${arquivo}"
              echo "Modo encontrado: ${modo:-AUSENTE}"
              echo "Modo esperado: 100755"
              exit 1
            fi

            echo "OK: ${arquivo} = ${modo}"

          done

          TAXONOMIA="scripts/base-conhecimento/taxonomia.py"

          if [[ ! -f "${TAXONOMIA}" ]]; then
            echo "ERRO: arquivo ausente: ${TAXONOMIA}"
            exit 1
          fi

          modo="$(
            git ls-files --stage -- "${TAXONOMIA}" |
            awk '{print $1}'
          )"

          if [[ "${modo}" != "100644" ]]; then
            echo "ERRO: modo Git inválido para ${TAXONOMIA}"
            echo "Modo encontrado: ${modo:-AUSENTE}"
            echo "Modo esperado: 100644"
            exit 1
          fi

          echo "OK: ${TAXONOMIA} = ${modo}"

          TEMPLATE="scripts/base-conhecimento/templates/artigo-v1.html"

          if [[ ! -f "${TEMPLATE}" ]]; then
            echo "ERRO: arquivo ausente: ${TEMPLATE}"
            exit 1
          fi

          modo="$(
            git ls-files --stage -- "${TEMPLATE}" \
            | awk '{print $1}'
          )"

          if [[ "${modo}" != "100644" ]]; then
            echo "ERRO: modo Git inválido para ${TEMPLATE}"
            echo "Modo encontrado: ${modo:-AUSENTE}"
            echo "Modo esperado: 100644"
            exit 1
          fi

          echo "OK: ${TEMPLATE} = ${modo}"

          CATALOGO="scripts/base-conhecimento/editorial/catalogo.json"

          if [[ ! -f "${CATALOGO}" ]]; then
            echo "ERRO: arquivo ausente: ${CATALOGO}"
            exit 1
          fi

          modo="$(
            git ls-files --stage -- "${CATALOGO}" \
            | awk '{print $1}'
          )"

          if [[ "${modo}" != "100644" ]]; then
            echo "ERRO: modo Git inválido para ${CATALOGO}"
            echo "Modo encontrado: ${modo:-AUSENTE}"
            echo "Modo esperado: 100644"
            exit 1
          fi

          echo "OK: ${CATALOGO} = ${modo}"

          MODULOS_JS=(
            "base-conhecimento/assets/js/normalizador.js"
            "base-conhecimento/assets/js/categorias.js"
            "base-conhecimento/assets/js/pesquisa.js"
            "base-conhecimento/assets/js/consulta.js"
            "base-conhecimento/assets/js/interface.js"
          )

          for arquivo in "${MODULOS_JS[@]}"; do

            if [[ ! -f "${arquivo}" ]]; then
              echo "ERRO: arquivo ausente: ${arquivo}"
              exit 1
            fi

            modo="$(
              git ls-files --stage -- "${arquivo}"               | awk '{print $1}'
            )"

            if [[ "${modo}" != "100644" ]]; then
              echo "ERRO: modo Git inválido para ${arquivo}"
              echo "Modo encontrado: ${modo:-AUSENTE}"
              echo "Modo esperado: 100644"
              exit 1
            fi

            echo "OK: ${arquivo} = ${modo}"

          done

      - name: Validar sintaxe Python
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-pycache
        run: |
          set -Eeuo pipefail

          python3 -m py_compile \
            scripts/base-conhecimento/taxonomia.py \
            scripts/base-conhecimento/testar-taxonomia.py \
            scripts/base-conhecimento/validar-artigos.py \
            scripts/base-conhecimento/gerar-indice.py \
            scripts/base-conhecimento/testar-gerador-indice.py \
            scripts/base-conhecimento/testar-template-artigo.py \
            scripts/base-conhecimento/criar-artigo.py \
            scripts/base-conhecimento/testar-criar-artigo.py \
            scripts/base-conhecimento/testar-criar-artigo-persistencia.py \
            scripts/base-conhecimento/validar-catalogo-editorial.py \
            scripts/base-conhecimento/testar-catalogo-editorial.py \
            scripts/base-conhecimento/testar-seo-artigos.py \
            scripts/base-conhecimento/gerar-relacionados.py \
            scripts/base-conhecimento/testar-gerar-relacionados.py \
            scripts/base-conhecimento/renderizar-relacionados.py \
            scripts/base-conhecimento/testar-renderizar-relacionados.py \
            scripts/base-conhecimento/sincronizar-artigos.py \
            scripts/base-conhecimento/testar-sincronizar-artigos.py

          echo "OK: sintaxe Python válida."

      - name: Validar sintaxe JavaScript
        run: |
          set -Eeuo pipefail

          MODULOS_JS=(
            "base-conhecimento/assets/js/normalizador.js"
            "base-conhecimento/assets/js/categorias.js"
            "base-conhecimento/assets/js/pesquisa.js"
            "base-conhecimento/assets/js/consulta.js"
            "base-conhecimento/assets/js/interface.js"
          )

          TESTES_JS=(
            "scripts/base-conhecimento/testar-categorias.mjs"
            "scripts/base-conhecimento/testar-pesquisa.mjs"
            "scripts/base-conhecimento/testar-consulta.mjs"
            "scripts/base-conhecimento/testar-interface.mjs"
          )

          for arquivo in "${MODULOS_JS[@]}"; do
            node               --experimental-default-type=module               --check               "${arquivo}"
          done

          for arquivo in "${TESTES_JS[@]}"; do
            node --check "${arquivo}"
          done

          echo "OK: sintaxe JavaScript válida."

      - name: Executar testes da taxonomia
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-taxonomia.py

      - name: Executar testes do gerador
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-gerador-indice.py

      - name: Executar testes do template oficial de artigo
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-template-artigo.py

      - name: Executar testes do Gerador Oficial de Artigos
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-criar-artigo.py

      - name: Executar testes da persistência transacional
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-criar-artigo-persistencia.py

      - name: Executar testes do Catálogo Editorial
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-catalogo-editorial.py

      - name: Executar testes do Gerador de Artigos Relacionados
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-gerar-relacionados.py

      - name: Executar testes do Sincronizador Editorial
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-sincronizar-artigos.py

      - name: Executar testes da taxonomia JavaScript
        run: |
          set -Eeuo pipefail

          node             --experimental-default-type=module             scripts/base-conhecimento/testar-categorias.mjs

      - name: Executar testes do motor de pesquisa
        run: |
          set -Eeuo pipefail

          node             --experimental-default-type=module             scripts/base-conhecimento/testar-pesquisa.mjs

      - name: Executar testes da consulta integrada
        run: |
          set -Eeuo pipefail

          node             --experimental-default-type=module             scripts/base-conhecimento/testar-consulta.mjs

      - name: Executar testes da interface categorial
        run: |
          set -Eeuo pipefail

          node \
            --experimental-default-type=module \
            scripts/base-conhecimento/testar-interface.mjs

      - name: Validar artigos reais
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/validar-artigos.py

      - name: Executar testes do SEO Individual
        run: |
          set -Eeuo pipefail

          PYTHONDONTWRITEBYTECODE=1 \
          python3 \
            scripts/base-conhecimento/testar-seo-artigos.py

      - name: Sincronizar estado editorial oficial
        run: |
          set -Eeuo pipefail

          COMMIT_DATE="$(
            git show \
              -s \
              --format=%cI \
              HEAD
          )"

          PUBLICATION_DATE="$(
            TZ=America/Sao_Paulo \
            date \
              -d "${COMMIT_DATE}" \
              +%F
          )"

          echo "Commit date: ${COMMIT_DATE}"
          echo "Publication date: ${PUBLICATION_DATE}"

          python3 \
            scripts/base-conhecimento/sincronizar-artigos.py \
            --publication-date "${PUBLICATION_DATE}" \
            --write

      - name: Validar JSON gerado
        run: |
          set -Eeuo pipefail

          python3 -m json.tool \
            base-conhecimento/data/indice.json \
            > /dev/null

          python3 -m json.tool \
            base-conhecimento/data/relacionados.json \
            > /dev/null

          python3 -m json.tool \
            scripts/base-conhecimento/editorial/catalogo.json \
            > /dev/null

          echo "OK: indice.json é JSON válido."
          echo "OK: relacionados.json é JSON válido."
          echo "OK: catalogo.json é JSON válido."

      - name: Validar Catálogo Editorial sincronizado
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/validar-catalogo-editorial.py

      - name: Verificar correspondência do índice
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/gerar-indice.py \
            --check

          echo "OK: indice.json corresponde aos artigos."

      - name: Verificar correspondência dos relacionados
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/gerar-relacionados.py \
            --check

          echo "OK: relacionados.json corresponde ao estado editorial."

      - name: Verificar renderização dos relacionados
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/renderizar-relacionados.py \
            --check

          echo "OK: artigos correspondem ao grafo de relacionados."

      - name: Confirmar estado editorial sincronizado
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/sincronizar-artigos.py \
            --check

      - name: Executar testes do Renderizador Estático de Artigos Relacionados
        run: |
          set -Eeuo pipefail

          python3 \
            scripts/base-conhecimento/testar-renderizar-relacionados.py

      - name: Controlar alterações produzidas
        id: derivados
        run: |
          set -Eeuo pipefail

          CATALOG="scripts/base-conhecimento/editorial/catalogo.json"
          INDEX="base-conhecimento/data/indice.json"
          RELATED="base-conhecimento/data/relacionados.json"
          ARTICLES_DIR="base-conhecimento/artigos"

          echo "===== GIT DIFF CHECK ====="
          git diff --check

          echo
          echo "===== ARQUIVOS MODIFICADOS ====="

          modificados="$(
            {
              git diff --name-only
              git ls-files \
                --others \
                --exclude-standard
            } \
            | sort -u
          )"

          if [[ -n "${modificados}" ]]; then
            printf '%s\n' "${modificados}"
          else
            echo "Nenhuma alteração."
          fi

          inesperados="$(
            printf '%s\n' "${modificados}" \
            | awk \
              -v catalog_path="${CATALOG}" \
              -v index_path="${INDEX}" \
              -v related_path="${RELATED}" '
                NF == 0 {
                  next
                }

                $0 == catalog_path {
                  next
                }

                $0 == index_path {
                  next
                }

                $0 == related_path {
                  next
                }

                $0 ~ /^base-conhecimento\/artigos\/[^/]+\.html$/ {
                  next
                }

                {
                  print
                }
              '
          )"

          if [[ -n "${inesperados}" ]]; then

            echo
            echo "ERRO DE INTEGRIDADE:"
            echo "O processo alterou arquivos não autorizados."
            echo
            printf '%s\n' "${inesperados}"

            exit 1

          fi

          derivados="$(
            git status \
              --porcelain \
              -- \
              "${CATALOG}" \
              "${INDEX}" \
              "${RELATED}" \
              "${ARTICLES_DIR}"
          )"

          if [[ -z "${derivados}" ]]; then

            echo
            echo "Artefatos derivados já estavam sincronizados."

            echo "changed=false" \
              >> "${GITHUB_OUTPUT}"

          else

            echo
            echo "Artefatos derivados precisam de commit técnico."

            echo "changed=true" \
              >> "${GITHUB_OUTPUT}"

          fi

      - name: Preparar alterações derivadas
        if: steps.derivados.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          CATALOG="scripts/base-conhecimento/editorial/catalogo.json"
          INDEX="base-conhecimento/data/indice.json"
          RELATED="base-conhecimento/data/relacionados.json"
          ARTICLES_DIR="base-conhecimento/artigos"

          git add -- \
            "${CATALOG}" \
            "${INDEX}" \
            "${RELATED}" \
            "${ARTICLES_DIR}"

          git diff --cached --check

          staged="$(
            git diff \
              --cached \
              --name-only
          )"

          if [[ -z "${staged}" ]]; then

            echo "ERRO DE INTEGRIDADE:"
            echo "Nenhum artefato derivado foi staged."

            exit 1

          fi

          inesperados="$(
            printf '%s\n' "${staged}" \
            | awk \
              -v catalog_path="${CATALOG}" \
              -v index_path="${INDEX}" \
              -v related_path="${RELATED}" '
                NF == 0 {
                  next
                }

                $0 == catalog_path {
                  next
                }

                $0 == index_path {
                  next
                }

                $0 == related_path {
                  next
                }

                $0 ~ /^base-conhecimento\/artigos\/[^/]+\.html$/ {
                  next
                }

                {
                  print
                }
              '
          )"

          if [[ -n "${inesperados}" ]]; then

            echo "ERRO DE INTEGRIDADE:"
            echo "A área staged contém arquivos não autorizados."
            echo
            printf '%s\n' "${inesperados}"

            exit 1

          fi

          echo "OK: somente artefatos derivados autorizados estão staged."

      - name: Confirmar que main não avançou
        if: steps.derivados.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            origin \
            main

          local_sha="$(
            git rev-parse HEAD
          )"

          remoto_sha="$(
            git rev-parse origin/main
          )"

          echo "HEAD local:  ${local_sha}"
          echo "origin/main: ${remoto_sha}"

          if [[ "${local_sha}" != "${remoto_sha}" ]]; then

            echo
            echo "ERRO:"
            echo "A branch main avançou durante a execução."
            echo "Nenhum force push será realizado."

            exit 1

          fi

          echo "OK: main permanece no commit esperado."

      - name: Criar e enviar commit técnico
        if: steps.derivados.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Atualiza artefatos derivados da Base de Conhecimento"

          echo
          echo "===== COMMIT TÉCNICO ====="

          git log \
            -1 \
            --oneline \
            --decorate

          echo
          echo "===== PUSH ====="

          git push \
            origin \
            HEAD:main

      - name: Confirmar integridade após indexação
        run: |
          set -Eeuo pipefail

          status="$(
            git status --porcelain
          )"

          if [[ -n "${status}" ]]; then

            echo "ERRO:"
            echo "Working tree não está limpo."
            echo
            printf '%s\n' "${status}"

            exit 1

          fi

          echo "OK: working tree limpo."

          echo
          echo "===== COMMIT QUE SERÁ PUBLICADO ====="

          git log \
            -1 \
            --oneline \
            --decorate

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Criar artefato do site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .
          include-hidden-files: false
          retention-days: 1


  publicar:

    name: Publicar GitHub Pages

    needs:
      - indexar

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

      - name: Resultado da publicação
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "DATADARK TECNOLOGIA"
          echo "INDEXAÇÃO E PUBLICAÇÃO CONCLUÍDAS"
          echo "=============================================="

          echo
          echo "URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
