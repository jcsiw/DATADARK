<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>404 | DATADARK Tecnologia</title>

<meta name="robots" content="noindex">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    height:100%;

}

body{

    background:
        radial-gradient(circle at top,#10344d 0%,#0a0f16 35%,#050608 100%);

    overflow:hidden;

    color:#ffffff;

    font-family:'Segoe UI',sans-serif;

}

/* grade tecnológica */

body::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:

        linear-gradient(rgba(0,255,255,.04) 1px,transparent 1px),

        linear-gradient(90deg,rgba(0,255,255,.04) 1px,transparent 1px);

    background-size:40px 40px;

    opacity:.45;

}

/* brilho */

body::after{

    content:"";

    position:absolute;

    width:700px;

    height:700px;

    left:50%;

    top:45%;

    transform:translate(-50%,-50%);

    background:radial-gradient(circle,#00d5ff22 0%,transparent 70%);

    filter:blur(25px);

}

.main{

    position:relative;

    z-index:2;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100%;

}

.card404{

    text-align:center;

    max-width:760px;

    padding:60px;

    border:1px solid rgba(0,255,255,.15);

    background:rgba(15,20,28,.75);

    backdrop-filter:blur(15px);

    border-radius:20px;

    box-shadow:

        0 0 50px rgba(0,255,255,.08);

}

.logo{

    width:260px;

    max-width:90%;

    margin-bottom:35px;

}

.error{

    font-size:110px;

    font-weight:800;

    color:#00eaff;

    text-shadow:

        0 0 15px #00eaff,

        0 0 30px #00eaff33;

}

.title{

    font-size:34px;

    font-weight:600;

    margin-bottom:15px;

}

.desc{

    color:#d8d8d8;

    font-size:18px;

    line-height:1.7;

}

.timer{

    margin-top:35px;

    font-size:20px;

    color:#7efcff;

}

.timer span{

    color:#00ffff;

    font-size:38px;

    font-weight:bold;

}

.btn-home{

    margin-top:35px;

    padding:14px 35px;

    border-radius:40px;

    font-weight:600;

    letter-spacing:.5px;

    transition:.3s;

}

.btn-home:hover{

    box-shadow:0 0 25px #00ffff88;

    transform:translateY(-2px);

}

.footer{

    margin-top:45px;

    color:#8d98a5;

    font-size:.9rem;

}

@media(max-width:768px){

.card404{

padding:35px 25px;

margin:20px;

}

.logo{

width:190px;

}

.error{

font-size:72px;

}

.title{

font-size:26px;

}

.desc{

font-size:16px;

}

}

</style>

</head>

<body>

<div class="main">

<div class="card404">

<img src="https://www.datadar.com.br/assets/img/logo.png"
     class="logo"
     alt="DATADARK Tecnologia">

<div class="error">

404

</div>

<h1 class="title">

Página não encontrada

</h1>

<p class="desc">

O endereço solicitado não existe ou foi removido.<br>

Você será redirecionado automaticamente para a página inicial.

</p>

<div class="timer">

Redirecionando em <span id="count">3</span>...

</div>

<a href="/"

class="btn btn-outline-info btn-home">

<i class="bi bi-house-door-fill"></i>

Ir para a Página Inicial

</a>

<div class="footer">

© DATADARK Tecnologia

</div>

</div>

</div>

<script>

let tempo=10;

const contador=document.getElementById("count");

const intervalo=setInterval(()=>{

tempo--;

contador.textContent=tempo;

if(tempo<=0){

clearInterval(intervalo);

window.location.replace("/");

}

},1000);

</script>

</body>
</html>
